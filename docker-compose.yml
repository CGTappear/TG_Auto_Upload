services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped

    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1

    ports:
      - "8081:8081"

    # 让容器可以通过 host.docker.internal 访问宿主机（Linux 需要；Windows/Mac Docker Desktop 自带）
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./telegram-bot-api-data:/var/lib/telegram-bot-api

  cgtappear-uploader:
    build: .
    container_name: cgtappear-uploader
    restart: unless-stopped

    depends_on:
      - telegram-bot-api

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-http://telegram-bot-api:8081}

      # 宿主机系统代理（在 .env 中设置 PROXY_URL，例如 http://host.docker.internal:7890）
      PROXY_URL: ${PROXY_URL:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,telegram-bot-api}

      PICTURES_DIR: /data/pictures
      VIDEOS_DIR: /data/videos
      MUSIC_DIR: /data/music

      PICTURES_HOST_DIR: "D:/Pictures"
      VIDEOS_HOST_DIR: "D:/videos"
      MUSIC_HOST_DIR: "D:/Music"

      DB_FILE: /app/state/uploaded_files.json

    volumes:
      - ./state:/app/state

      - D:/Pictures:/data/pictures
      - D:/videos:/data/videos
      - D:/Music:/data/music